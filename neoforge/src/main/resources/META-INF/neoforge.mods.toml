modLoader = "javafml"
loaderVersion = "${neoforge_loader_version_range}"
license = "${license}"
issueTrackerURL="https://github.com/ProstStuff/Reconstruct-What/issues"

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
displayURL="https://github.com/ProstStuff/Reconstruct-What"
logoFile="${mod_id}.png"
logoBlur=false
credits="${credits}"
authors = "${mod_author}"
description = '''${description}\nA JSON-based config & multiloader abstraction libary.'''

[[dependencies.${mod_id}]]
modId = "neoforge"
type="optional"
versionRange = "[${neoforge_version},)"
ordering = "NONE"
side = "BOTH"
[[dependencies.${mod_id}]]
modId = "minecraft"
type="required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"